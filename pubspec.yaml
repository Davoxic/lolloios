name: lolloios
description: "Player musicale YouTube con gestione playlist per iOS (porting da APK)."
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.9.46
  just_audio_background: ^0.0.1-beta.15
  audio_session: ^0.1.25
  youtube_explode_dart: ^3.1.0
  shared_preferences: ^2.5.3
  http: ^1.3.0
  uuid: ^4.5.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
